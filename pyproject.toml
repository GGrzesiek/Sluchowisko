[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: unused imports/variables, undefined names
  "I",        # import sorting
  "B",        # bugbear: likely bugs
  "UP",       # modern Python syntax
  "DJ",       # Django-specific checks
]
ignore = ["E501"]  # long lines are handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["config", "transit", "facts"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-city-museum"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["config*", "transit*", "facts*"]