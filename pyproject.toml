[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muzeum-w-autobusie"
version = "0.1.0"
description = "Data pipeline for short, sourced stories about places passed on Warsaw public transport"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.6.9"]

[project.scripts]
mwa = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
