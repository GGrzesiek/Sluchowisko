name: CI

on:
  pull_request:
  push:
    branches: [development, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.6.9 check --output-format=github .
      - run: pipx run ruff==0.6.9 format --check .

  format:
    name: Formatting (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3.3.3 --check .

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint -color

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: git update-ref refs/remotes/origin/development HEAD
      - run: PAGES_BASE_PATH=/opendatahackathon42 python3 .github/pages/build.py _site
      - run: test -f _site/index.html && test -f _site/dev/index.html && test -f _site/dev/version.json

  app:
    name: App (npm lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: hashFiles('web/package.json') != ''
        run: npm ci
      - if: hashFiles('web/package.json') != ''
        run: npm run lint --if-present
      - if: hashFiles('web/package.json') != ''
        run: npm test --if-present
      - if: hashFiles('web/package.json') != ''
        run: npm run build
