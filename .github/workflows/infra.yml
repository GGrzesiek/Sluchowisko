name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [development]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_VAR_members: ${{ vars.INFRA_MEMBERS }}
  WORKLOAD_IDENTITY_PROVIDER: projects/314520931870/locations/global/workloadIdentityPools/github/providers/github
  CLOUDSQL_INSTANCE: muzeum-w-autobusie-2026:europe-central2:muzeum
  CLOUD_SQL_PROXY_VERSION: v2.26.0

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: tf-plan@muzeum-w-autobusie-2026.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -lock=false -no-color -out=tfplan
      - run: |
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: tf-apply@muzeum-w-autobusie-2026.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: |
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false tfplan
      - name: Grant database access
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: muzeum
          PGUSER: tf-apply@muzeum-w-autobusie-2026.iam
        run: |
          curl -sSfLo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn "$CLOUDSQL_INSTANCE" &
          for _ in $(seq 30); do pg_isready -q && break; sleep 1; done
          {
            cat database.sql
            jq -r '.[] | "GRANT team TO \"" + . + "\";"' <<< "$TF_VAR_members"
          } | psql -v ON_ERROR_STOP=1 -v team_group="$(terraform output -raw team_group)" -v api_user="$(terraform output -raw api_db_user)"
