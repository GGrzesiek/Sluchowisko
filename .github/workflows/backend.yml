name: Backend

on:
  push:
    branches: [development]
    paths:
      - "config/**"
      - "transit/**"
      - "facts/**"
      - "stories/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/314520931870/locations/global/workloadIdentityPools/github/providers/github
  REGION: europe-central2
  IMAGE: europe-central2-docker.pkg.dev/muzeum-w-autobusie-2026/backend/backend
  CLOUDSQL_INSTANCE: muzeum-w-autobusie-2026:europe-central2:muzeum
  CLOUD_SQL_PROXY_VERSION: v2.26.0

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: tf-apply@muzeum-w-autobusie-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
      - name: Migrate the database
        run: |
          set -o pipefail
          curl -sSfLo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn "$CLOUDSQL_INSTANCE" &
          for _ in $(seq 30); do pg_isready -h 127.0.0.1 -q && break; sleep 1; done
          {
            echo '### Database migrations'
            echo '```'
            docker run --rm --network host -e DEBUG=0 -e SECRET_KEY=migrate \
              -e DATABASE_URL="postgres://tf-apply%40muzeum-w-autobusie-2026.iam@127.0.0.1:5432/muzeum" \
              "${IMAGE}:${GITHUB_SHA}" python manage.py migrate --noinput
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy without traffic
        run: |
          gcloud run services update backend --region "$REGION" --no-traffic --tag candidate \
            --container app --image "${IMAGE}:${GITHUB_SHA}"
      - name: Health check on the new revision
        run: |
          url=$(gcloud run services describe backend --region "$REGION" --format json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          for _ in $(seq 10); do
            if curl -sS --fail-with-body "$url/api/health/"; then exit 0; fi
            echo
            sleep 6
          done
          echo "::error::New revision is unhealthy; traffic stays on the previous one. See the JSON above (db / city_api)."
          exit 1
      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic backend --region "$REGION" --to-latest
          url=$(gcloud run services describe backend --region "$REGION" --format 'value(status.url)')
          echo "Backend: $url" >> "$GITHUB_STEP_SUMMARY"
