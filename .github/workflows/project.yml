name: Project board

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

env:
  PROJECT_OWNER: GGrzesiek
  PROJECT_NUMBER: 6
  PROJECT_ID: PVT_kwHOBKFsCs4BndnV
  STATUS_FIELD_ID: PVTSSF_lAHOBKFsCs4BndnVzhmCIOo
  STATUS_TODO_ID: 4ecf1c3f

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to the board as Todo
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROJECT_TOKEN is missing. Add a classic PAT with the 'project' scope."
            exit 1
          fi
          item_id=$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --format json --jq .id)
          gh project item-edit --id "$item_id" --project-id "$PROJECT_ID" \
            --field-id "$STATUS_FIELD_ID" --single-select-option-id "$STATUS_TODO_ID"
          echo "Added $ISSUE_URL to project $PROJECT_NUMBER as Todo" >> "$GITHUB_STEP_SUMMARY"
